name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The second entry is the MSRV declared in Cargo.toml.
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked --all-targets

      - name: Doc tests
        run: cargo test --locked --doc

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the release binary
        run: cargo build --locked --release

      # systemd-analyze resolves ExecStart= and SupplementaryGroups=, so both
      # have to exist before the unit can be verified.
      - name: Stage the binary and the group
        run: |
          sudo install -Dm0755 target/release/headset-battery-indicator \
            /usr/local/bin/headset-battery-indicator
          sudo groupadd --system --force headset-battery

      - name: Verify the systemd unit
        run: systemd-analyze verify packaging/systemd/headset-battery-indicator.service

      - name: Check the unit's hardening score
        run: systemd-analyze security --offline=true packaging/systemd/headset-battery-indicator.service

      - name: Smoke-test the installed binary
        run: |
          headset-battery-indicator --version
          headset-battery-indicator --help
          ./install.sh --help

name: CI

# rustfmt, clippy, build and tests (unit, integration, doc) on stable and on
# the MSRV, rustdoc and cargo audit, all with warnings denied: the Rust CI
# shared by this author's repositories, kept in uhid-battery. The packaging
# and shellcheck jobs are this daemon's own.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The token only needs to read the repository: no job here writes anything.
permissions:
  contents: read

jobs:
  rust:
    uses: GregDuhamel/uhid-battery/.github/workflows/rust-ci.yml@main
    with:
      # The MSRV declared in Cargo.toml.
      msrv: "1.85"
      all-features: true

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the release binary
        run: cargo build --locked --release

      # systemd-analyze resolves ExecStart= and SupplementaryGroups=, so both
      # have to exist before the unit can be verified.
      - name: Stage the binary and the group
        run: |
          sudo install -Dm0755 target/release/headset-battery-indicator \
            /usr/local/bin/headset-battery-indicator
          sudo groupadd --system --force headset-battery

      - name: Verify the systemd unit
        run: systemd-analyze verify packaging/systemd/headset-battery-indicator.service

      - name: Check the unit's hardening score
        run: systemd-analyze security --offline=true packaging/systemd/headset-battery-indicator.service

      - name: Smoke-test the installed binary
        run: |
          headset-battery-indicator --version
          headset-battery-indicator --help
          ./install.sh --help

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh
